# Spring Actuator Info App
info.app.title=&appTitle Clio REST API
info.app.description=Checking Links In Operation-automatic link checking for Metis
info.app.version=1.0.0
info.app.repository=https://github.com/europeana/clio
info.app.contact.name=Europeana Foundation
info.app.contact.email=info@europeana.eu
info.app.contact.url=www.europeana.eu

#Truststore
truststore.path=
truststore.password=

# Elastic APM
elastic.apm.enabled=false
elastic.apm.recording=true
elastic.apm.instrument=true
elastic.apm.service_name=clio-reporting-local
elastic.apm.server_url=
elastic.apm.environment=local
elastic.apm.application_packages=eu.europeana
elastic.apm.log_level=ERROR
elastic.apm.capture_body=all
elastic.apm.capture_headers=true
elastic.apm.metrics_interval=5s

#Spring
springdoc.packages-to-scan=eu.europeana.clio.reporting.rest
springdoc.paths-to-match=/**

#Clio
#CORS
clio.allowedCorsHosts=*
#Reports
# The String.format() - compatible template for the link to the dataset to be included in the
# report.
# It expects one occurrence of '%s' that will contain the dataset ID.
clio.datasetReportLinkTemplate=https://metis.europeana.eu/dataset/edit/%s

#Hibernate configuration
hibernate.connection.driver_class=org.postgresql.Driver
hibernate.connection.url=jdbc:postgresql://localhost:5432/metis-clio
hibernate.connection.username=postgres
hibernate.connection.password=postgres
hibernate.c3p0.min_size=5
hibernate.c3p0.max_size=20
hibernate.c3p0.timeout=1800
hibernate.c3p0.max_statements=50
hibernate.hbm2ddl.auto=none
